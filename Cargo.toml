[workspace]
resolver = "2"
members = [ "gtk4", "state", "state-derive", "ilp", "ilp-modeler", "ilp-modeler-derive", "time" , "storage", "state-colloscopes" , "testgen-colloscopes" , "python-old", "python", "python-runner", "ops", "rpc", "rpc-engine", "constraints-colloscopes", "constraints-groups", "xlsx", "mps", "collo-cbc", "subprocesses", "rooms", "rooms-model", "constraints-rooms", "strategies", "settings", "ui-text"]

[workspace.package]
version = "0.1.0-alpha.1.99"
edition = "2024"
authors = ["Christoph Charles"]

[workspace.dependencies]
anyhow = "1.0"
serde = "1.0"
serde_json = "1.0"
serde_with = "3.13"
semver = "1.0"
thiserror = "1.0"
tokio = "1.45"
clap = "4.5"
ordered-float = "4.2"
async-trait = "0.1"
chrono = "0.4"
futures = "0.3"
non-empty-string = "0.2.6"
pyo3 = "0.29"
# `rfd`: the features are the point of this entry, not the version. `xdg-portal`
# keeps GTK3 and its C headers out of the build, and `tokio` is the runtime
# `ashpd` — and through it `zbus` — expects to be spawned onto. Cargo unifies
# features across the workspace, so a crate asking for `async-std` here would
# hand every other crate a `zbus` with both runtimes turned on.
rfd = { version = "0.15", default-features = false, features = [ "xdg-portal", "tokio" ] }
