[workspace]
resolver = "2"
members = [ "gtk4", "state", "state-derive", "ilp", "ilp-modeler", "ilp-modeler-derive", "time" , "storage", "state-colloscopes" , "testgen-colloscopes" , "python", "ops", "rpc", "rpc-engine", "constraints-colloscopes", "constraints-groups", "xlsx", "mps", "collo-cbc", "subprocesses", "rooms", "rooms-model", "constraints-rooms", "strategies"]

[workspace.package]
version = "0.1.0-alpha.0.99"
edition = "2024"
authors = ["Christoph Charles"]

[workspace.dependencies]
anyhow = "1.0"
serde = "1.0"
serde_json = "1.0"
serde_with = "3.13"
semver = "1.0"
thiserror = "1.0"
tokio = "1.45"
clap = "4.5"
ordered-float = "4.2"
async-trait = "0.1"
chrono = "0.4"
futures = "0.3"
non-empty-string = "0.2.6"
