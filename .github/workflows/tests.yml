name: Tests

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  test:
    # Not ubuntu-latest: that is the 24.04 LTS, whose libadwaita is too old for
    # Collomatique (see the build instructions in README.md).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # The package list from README.md, plus pkg-config, which nothing in that
      # list is guaranteed to pull in.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libglib2.0-dev libpango1.0-dev \
            libgdk-pixbuf-2.0-dev libgraphene-1.0-dev libgtk-4-dev \
            libadwaita-1-dev coinor-libcbc-dev coinor-cbc libpython3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test suite
        run: cargo full-test
