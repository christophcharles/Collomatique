[package]
name = "collomatique-python"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
collomatique-ops = { path = "../ops" }
collomatique-settings = { path = "../settings" }
collomatique-state = { path = "../state" }
collomatique-state-colloscopes = { path = "../state-colloscopes" }
collomatique-storage = { path = "../storage" }
collomatique-time = { path = "../time" }
chrono.workspace = true
# `chrono`: `datetime.date` <-> `chrono::NaiveDate`, for the first week of the
# colles.
pyo3 = { workspace = true, features = [ "chrono" ] }
