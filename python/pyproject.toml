# The wheel side of this crate: what `maturin build` here produces, so a plain
# interpreter can `import collomatique` with no collomatique binary around.
# The embedded side needs none of this — `python-runner` links the `rlib` and
# registers the module itself.

[build-system]
requires = [ "maturin>=1.0,<2.0" ]
build-backend = "maturin"

[project]
name = "collomatique"
requires-python = ">=3.9"
description = "Automatic colloscope building program"
# The version lives in the workspace `Cargo.toml`, like every other crate's;
# `dynamic` is how PEP 621 says "not written here".
dynamic = [ "version" ]

[tool.maturin]
# The crate is `collomatique-python`, but an extension module has to be named
# after the `#[pymodule]` function it exports — `collomatique` (`src/lib.rs`).
module-name = "collomatique"
# On for a wheel, which is dlopened into an interpreter that already has its
# own libpython, and off everywhere else: the embedded build links libpython
# itself and would not survive it. Asked for from here rather than from a
# feature of the crate, so cargo's feature unification never sees it in a
# workspace build.
features = [ "pyo3/extension-module" ]
