[package]
name = "collomatique-ui-text"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
collomatique-state-colloscopes = { path = "../../colloscopes/state-colloscopes" }
collomatique-strategies = { path = "../../generic/strategies" }
collomatique-storage = { path = "../../colloscopes/storage" }
collomatique-time = { path = "../../generic/time" }
chrono.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Only the rendering tests need it: they build a document through `AppState` to
# pin the shapes [render_period] can take. `Description` is a `Send + Sync +
# Clone` trait, so a test-local stand-in for `collomatique_ops`'s `Desc` works
# and keeps this crate out of a cycle with the crate that depends on it.
collomatique-state = { path = "../../generic/state" }
