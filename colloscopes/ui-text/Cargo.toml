[package]
name = "collomatique-ui-text"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
collomatique-constraints-colloscopes = { path = "../../colloscopes/constraints-colloscopes" }
collomatique-state-colloscopes = { path = "../../colloscopes/state-colloscopes" }
collomatique-strategies = { path = "../../generic/strategies" }
collomatique-storage = { path = "../../colloscopes/storage" }
collomatique-time = { path = "../../generic/time" }
chrono.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The rendering and solver tests build a document through `AppState` to pin the
# shapes [render_period] and [fixed_pin_violation_text] can take. `Description`
# is a `Send + Sync + Clone` trait, so a test-local stand-in for
# `collomatique_ops`'s `Desc` works and keeps this crate out of a cycle with the
# crate that depends on it. `non-empty-string` only names a group.
collomatique-state = { path = "../../generic/state" }
non-empty-string.workspace = true
