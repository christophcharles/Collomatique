[package]
name = "collomatique-subprocesses"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
collomatique-rpc = { path = "../../generic/rpc" }
collomatique-ilp = { path = "../../generic/ilp", features = ["serde"] }
collomatique-ilp-modeler = { path = "../../generic/ilp-modeler", features = ["serde"] }
collomatique-strategies = { path = "../../generic/strategies" }
collomatique-time = { path = "../../generic/time" }
ordered-float.workspace = true
async-trait.workspace = true
futures.workspace = true
thiserror.workspace = true
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Win32_Security is not there for anything we name directly. windows-sys only
# emits a function when every type in its signature is available, and
# CreateJobObjectW takes a *const SECURITY_ATTRIBUTES, which lives in
# Win32::Security. Without this feature that one function silently disappears
# from Win32::System::JobObjects while its neighbours stay.
windows-sys = { version = "0.59", features = [
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Foundation",
  "Win32_Security",
] }
