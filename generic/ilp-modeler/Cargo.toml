[package]
name = "collomatique-ilp-modeler"
version.workspace = true
edition.workspace = true
authors.workspace = true

[features]
default = ["derive"]
derive = ["dep:collomatique-ilp-modeler-derive"]
serde = ["dep:serde", "dep:serde_json", "collomatique-ilp/serde"]

[dependencies]
collomatique-ilp = { path = "../../generic/ilp", default-features = false }
collomatique-ilp-modeler-derive = { path = "../../generic/ilp-modeler-derive", optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
collomatique-ilp = { path = "../../generic/ilp" }
