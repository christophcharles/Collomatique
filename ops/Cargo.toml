[package]
name = "collomatique-ops"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
collomatique-time = { path = "../time" }
collomatique-state-colloscopes = { path = "../state-colloscopes" }
collomatique-state = { path = "../state" }
# The entity renderers the warning texts call. It pulls `collomatique-storage`
# in transitively (the caveat sentences sit in the same crate); that is not the
# cycle the dev-dependency note below is about — storage depends on neither.
collomatique-ui-text = { path = "../ui-text" }
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
chrono.workspace = true
non-empty-string = { workspace = true, features = ["serde"] }

[dev-dependencies]
# Only the tests need it: they decode the frozen `tests/fixtures/hogwarts.collomatique`
# copy to get a realistic base document. No cycle — storage does not depend on `ops`.
collomatique-storage = { path = "../storage" }
# The property walk (`tests/property_update_ops.rs`) reuses testgen's document
# bootstrap and entity synthesizers. No cycle either — testgen depends on
# `state-colloscopes`, not on `ops`.
collomatique-testgen-colloscopes = { path = "../testgen-colloscopes" }
